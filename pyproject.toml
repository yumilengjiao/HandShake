[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "handshake-core"
version = "0.2.0"
description = "HandShake causal feature pipeline, baselines and gesture TCN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Verified Linux/Python 3.12 model-operation baseline; see docs/perception_diagnostics.md.
# 1.2.0 imports here but its native model initialization receives SIGKILL.
perception = ["mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86"]
training = ["torch", "scikit-learn"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
handshake = "backend.cli:main"
handshake-perception-probe = "backend.perception.probe:main"
handshake-data = "backend.importing.commands:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["shared*", "backend*", "algorithm*"]
exclude = ["tests*", "configs*", "data*", "artifacts*"]

[tool.setuptools.package-data]
shared = ["defaults/*.yaml", "defaults/*.json", "defaults/platforms/*.yaml", "features/*.json", "desktop_protocol.schema.json"]
algorithm = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
