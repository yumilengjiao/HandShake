format_version: trainer-v1
model_type: tcn
optimizer: AdamW
learning_rate: 0.001
weight_decay: 0.0001
batch_size: 64
max_epochs: 80
patience: 10
min_delta: 0.0001
grad_clip_norm: 1.0
seed: 42
device: cpu
threads: 1
sampling: uniform  # opt-in: supervised_uniform (all class_valid endpoints once/epoch)
class_weighting: none  # opt-in: sqrt_inverse (train-label counts only)
scheduler: constant  # opt-in: plateau (validation macro-F1)
lr_patience: 2
lr_factor: 0.5
min_learning_rate: 0.000001
checkpoint_metric: val_macro_f1
shuffle_labels_diagnostic: false
